<script language="JavaScript" type="text/javascript">

	PrintButton1 = new Image
	PrintButton2 = new Image
	logo1 = new Image
	logo2 = new Image
if (document.images) {
	PrintButton1.src = "images/print5.gif"
	PrintButton2.src = "images/print6.gif"
	logo1.src = "images/logo1.jpg"
	logo2.src = "images/logo2.jpg"
}


		var imgArray = new Array(
			'Image1Large.jpg',
			'Image2Large.jpg',
			'Image3Large.jpg',
			'Image4Large.jpg'
			

		);


		var titleArray = new Array(
			'Uncooked Spaghetti',
			'Raspberry Cake',
			'Campfire Cooking',
			'Salad'
			
		);
			
		var imgPath = "Images/Fullsize/";
		
		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle=titleArray[imgID];

      			textDiv.innerHTML = textTitle;
		}
			
		function preloadImages() {		
			for(var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}
		

</script>


</head>
<body onload="preloadImages()">
<div>
<a href="" onmouseover="document.getElementById('print').src='Images/PrintPage2.jpg';"
onmouseout="document.getElementById('print').src='Images/PrintPage1.jpg';">
<img src="Images/PrintPage1.jpg" alt="Print Page" width="200" height="50"
id="print"></a>
</div>

<div align="center">

	name="PrintButton" alt="PrintButton" style="border:none;"/>

	</a>
</div>


<div>

onmouseover="document.getElementById('logo').src='Images/Logo2.jpg';"

<img src="Images/Logo1.jpg" alt="Logo" id="logo"></a>
</div>

<br />
<br />
<br />

		<img src="Images/Thumbnails/image3Sm.jpg" alt="Campfire Cooking" onmouseover="swapImage(2);" />
		<img src="Images/Thumbnails/image4Sm.jpg" alt="Salad" onmouseover="swapImage(3);" />
		
</div>

	<div id="image">
